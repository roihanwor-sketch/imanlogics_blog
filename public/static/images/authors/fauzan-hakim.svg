<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-fauzan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="face-fauzan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
    <linearGradient id="robe-fauzan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background Circle with emerald islamic geometric aesthetic -->
  <circle cx="100" cy="100" r="96" fill="url(#bg-fauzan)" stroke="url(#gold-accent)" stroke-width="4" />
  
  <!-- Subtle Islamic 8-point geometric star in background -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="1.5" fill="none" transform="translate(100, 75) scale(0.6)">
    <rect x="-40" y="-40" width="80" height="80" />
    <rect x="-40" y="-40" width="80" height="80" transform="rotate(45)" />
    <circle cx="0" cy="0" r="48" />
  </g>

  <!-- Body / Scholarly Robe & Scarf -->
  <path d="M 36 200 C 36 145, 68 135, 100 135 C 132 135, 164 145, 164 200 Z" fill="url(#robe-fauzan)" />
  <!-- Elegant Emerald Scarf / Shawl -->
  <path d="M 70 138 C 80 165, 85 185, 82 200 L 118 200 C 115 185, 120 165, 130 138 Z" fill="#065f46" />
  <path d="M 94 145 L 100 160 L 106 145 Z" fill="url(#gold-accent)" />

  <!-- Neck -->
  <rect x="88" y="112" width="24" height="28" rx="4" fill="#fbcfe8" />

  <!-- Head -->
  <ellipse cx="100" cy="88" rx="36" ry="42" fill="url(#face-fauzan)" />

  <!-- Neat scholarly Peci / Cap -->
  <path d="M 66 65 C 66 48, 80 40, 100 40 C 120 40, 134 48, 134 65 L 134 72 L 66 72 Z" fill="#1e293b" />
  <line x1="66" y1="71" x2="134" y2="71" stroke="url(#gold-accent)" stroke-width="2" />

  <!-- Eyes with thoughtful, wise expression -->
  <path d="M 76 84 Q 84 81 92 85" stroke="#334155" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M 108 85 Q 116 81 124 84" stroke="#334155" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <circle cx="84" cy="89" r="3" fill="#1e293b" />
  <circle cx="116" cy="89" r="3" fill="#1e293b" />
  <circle cx="85" cy="88" r="1" fill="#ffffff" />
  <circle cx="117" cy="88" r="1" fill="#ffffff" />

  <!-- Neat, dignified beard & smile -->
  <path d="M 74 98 C 76 128, 86 138, 100 138 C 114 138, 124 128, 126 98 C 120 106, 110 114, 100 114 C 90 114, 80 106, 74 98 Z" fill="#334155" />
  <path d="M 90 104 Q 100 110 110 104" stroke="#78350f" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Scholar / Book badge on corner -->
  <g transform="translate(140, 140)">
    <circle cx="16" cy="16" r="16" fill="#065f46" stroke="url(#gold-accent)" stroke-width="2" />
    <text x="16" y="21" font-size="14" text-anchor="middle" fill="#ffffff">📖</text>
  </g>
</svg>
